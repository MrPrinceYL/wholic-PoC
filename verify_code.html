<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code eingeben | wholic</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body class="auth-page">
    <div class="auth-box">
        <a href="index.html"><img src="img/Wholic_Logo.png" alt="wholic" class="logo"></a>
        <form>
            <input placeholder="6-stelligen Code eingeben" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" id="code" name="code" required>
            <button id="submitCode">Code überprüfen</button>
        </form>
        <p><a href="login.html">Code nicht erhalten?</a></p>
    </div>
</body>
</html>
