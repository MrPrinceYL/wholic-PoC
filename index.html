<!DOCTYPE html>
<html lang="de">
<head>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
    (function(){
        emailjs.init({
            publicKey: "WjgWDyIfltKe2Brep",
        });
    })();
    </script>

    <script defer src="js/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-color: #602474;
            --text-color: #333;
            --primary-color: #602474;
            --secondary-color: #42b72a;
            --border-radius: 20px;
            --background-image: url('Bg.png');
        }

        body {
            background-image: url('./img/Bg.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            padding: 2em;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .login-logo {
            max-width: 200px;
            margin-bottom: 45px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 0.5em;
            font-weight: bold;
        }

        input[type="email"] {
            padding: 0.7em;
            margin-bottom: 1em;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            width: 250px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0.7em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #166fe5;
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.5);
        }

        input:focus, button:focus {
            outline: none;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="./img/Wholic_Logo.png" alt="Logo" class="login-logo">
        <form>
            <input placeholder="E-Mail-Adresse eingeben" type="email" id="email" name="email" required>
            <button id="submit">Login-Code anfordern</button>
        </form>
    </div>
</body>
</html>
