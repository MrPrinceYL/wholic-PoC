<!DOCTYPE html>
<html lang="de"><head>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
    (function(){
        emailjs.init({
            publicKey: "WjgWDyIfltKe2Brep",
        });
    })();
    </script>
    <script defer src="js/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code gesendet</title>
    
<style>
    :root {
        --bg-color: #602474;
    }
    
    body {
        background-image: url('./img/Bg.png');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        font-family: 'Arial', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #333;
    }

    .message-container {
        padding: 2em;
        border-radius: 10px;
        text-align: center;
        max-width: 400px;
        width: 100%;
        color: #ffffff;
    }

    .login-logo {
        max-width: 200px; /* Passe die Größe des Logos an */
        margin-bottom: 20px; /* Abstand zwischen Logo und Formular */
    }

    h1 {
        color: #039529;
        margin-bottom: 5px;
    }

    p {
        margin-bottom: 1em;
    }

    a {
        display: inline-block;
        background-color: #602474;
        color: white;
        text-decoration: none;
        padding: 0.7em 1.5em;
        transition: background-color 0.3s ease;
        border-radius: 20px;
    }

    a:hover {
        background-color: #218838;
    }

    .error {
        color: #dc3545;
        background-color: #f8d7da;
        padding: 1em;
        border-radius: 4px;
        margin-bottom: 1em;
    }
</style>

</head>
<body>
    <div class="message-container">
    <img src="./img/Wholic_Logo.png" alt="Logo" class="login-logo"></img>
    <!-- <h1>Erfolg!</h1> -->
    <p id="loginSuccessMessage">Ein Code wurde an **email** gesendet.<br>Bitte überprüfen Sie Ihr E-Mail-Postfach.</p>
    <a href="verify_code.html">Hier klicken, um den Code einzugeben</a>
    </div>

</body>
<script type="text/javascript">
    console.log(sessionStorage.getItem("enteredEmail"));
    document.getElementById("loginSuccessMessage").innerHTML = document.getElementById("loginSuccessMessage").innerHTML.replaceAll("**email**", sessionStorage.getItem("enteredEmail"));
    </script>

</html>
