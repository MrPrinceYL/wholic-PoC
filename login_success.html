<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code gesendet | wholic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <a href="index.html"><img src="img/Wholic_Logo.png" alt="wholic" class="logo"></a>
        <p id="loginSuccessMessage">Ein Code wurde gesendet.</p>
        <p>Bitte überprüfen Sie Ihr E-Mail-Postfach.</p>
        <a href="verify_code.html">Hier klicken, um den Code einzugeben</a>
        <script>
            // textContent statt innerHTML: die E-Mail-Adresse wird nicht als HTML ausgeführt
            const email = sessionStorage.getItem("enteredEmail");
            if (email) {
                document.getElementById("loginSuccessMessage").textContent = "Ein Code wurde an " + email + " gesendet.";
            }
        </script>
    </div>
</body>
</html>
